<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>iTask Manager</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="title">
            <h1>iTask Manager</h1>
        </div>

        <div class="subtitle">
            <p>Bem-vindo ao iTask Manager!</p>
            <p>Organize suas tarefas de forma eficiente e aumente sua produtividade.</p>
        </div>

        <form>
            <div class="task-fields">
                <div class="input-container">
                    <label for="task">Adicione uma nova tarefa:</label><br>
                    <input type="text" id="task" placeholder="Título da tarefa..."><br>
                </div>

                <div class="input-container">
                    <label for="task-description">Adicione a descrição da nova tarefa:</label><br>
                    <input type="text" id="task-description" placeholder="Descrição da tarefa..."><br>
                </div>             

                <button type="submit">Adicionar</button>
            </div>
        </form>

        <div class="title">
            <h2>Tarefas Adicionadas</h2>
        </div>

        <div>
            <ul>
            </ul>
        </div>
    </body>
</html>
