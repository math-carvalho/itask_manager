<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>iTask Manager</title>
    </head>
    <body>
        <div>
            <h1>iTask Manager</h1>
        </div>

        <div>
            <p>Bem-vindo ao iTask Manager!</p>
            <p>Organize suas tarefas de forma eficiente e aumente sua produtividade.</p>
        </div>

        <div>
            <form>
                <label for="tarefa">Adicione uma nova tarefa:</label>
                <input type="text" id="tarefa" placeholder="Título da tarefa..."><br>

                <label for="descricao-tarefa">Adicione a descrição da nova tarefa:</label>
                <input type="text" id="descricao-tarefa" placeholder="Descrição da tarefa..."><br>

                <button type="submit">Adicionar</button>
            </form>
        </div>

        <div>
            <h2>Tarefas Adicionadas</h2>
        </div>

        <div>
            <ul>
            </ul>
        </div>
    </body>
</html>
